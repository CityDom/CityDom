<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>City Dom 3D Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Prototype</p>
          <h1 id="viewer-title">City Dom 3D Viewer</h1>
          <p id="viewer-status">Booting viewer...</p>
        </div>
        <button id="reset-camera" type="button">Reset Camera</button>
      </header>

      <main class="viewport-shell">
        <canvas id="viewer-canvas" aria-label="3D character viewer"></canvas>
        <div id="error-banner" hidden></div>
      </main>

      <footer class="footer-hint">
        Drag to orbit. Mouse wheel to zoom. Press R to reset the camera.
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
